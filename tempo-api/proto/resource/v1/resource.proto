syntax = "proto3";

package tempopb.resource.v1;

import "common/v1/common.proto";

option go_package = "github.com/grafana/tempo/pkg/tempopb/resource/v1";

message Resource {
  repeated tempopb.common.v1.KeyValue attributes = 1;
  uint32 dropped_attributes_count = 2;
  repeated tempopb.common.v1.EntityRef entity_refs = 3;
}
