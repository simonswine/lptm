[package]
name = "logql-lsp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "logql-lsp"
path = "src/main.rs"

[lib]
name = "logql_lsp"
path = "src/lib.rs"

[dependencies]
logql-core = { path = "../logql-core" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
dashmap = "6"
log = "0.4"
